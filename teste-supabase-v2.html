<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste Supabase • El Shaddai</title>
<style>
body{font-family:Arial,sans-serif;background:#fff8e7;padding:20px;color:#222}h1{color:#c62828}.box{background:#fff;border-radius:14px;padding:16px;margin:12px 0;border:1px solid #ddd}.ok{color:#197a37}.err{color:#b00020}.wait{color:#996600}pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:12px;border-radius:10px}
</style>
</head>
<body>
<h1>🥟 Teste de conexão — V2</h1>
<div id="status" class="box wait">Iniciando teste...</div>
<div id="resultado" class="box"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function(){
 const status=document.getElementById('status');
 const resultado=document.getElementById('resultado');
 try{
   if(!window.supabase) throw new Error('1/3 • A biblioteca do Supabase não carregou.');
   status.textContent='1/3 • Biblioteca Supabase carregada.';

   const url='https://qjwojyxfktabdkbiryfx.supabase.co';
   const key='sb_publishable_eJ_vgt25nzDANKPq1jFW0g_EGnji9oG';
   const client=window.supabase.createClient(url,key);
   status.textContent='2/3 • Cliente Supabase criado.';

   const [c,p]=await Promise.all([
     client.from('categorias').select('id,nome,ativo').order('id'),
     client.from('produtos').select('id,nome,preco,categoria').order('id')
   ]);
   if(c.error) throw new Error('Categorias: '+c.error.message);
   if(p.error) throw new Error('Produtos: '+p.error.message);

   status.className='box ok';
   status.textContent='3/3 • CONEXÃO FUNCIONANDO ✅';
   resultado.innerHTML='<h3>Resultado</h3><p><b>Categorias encontradas:</b> '+c.data.length+'</p><p><b>Produtos encontrados:</b> '+p.data.length+'</p><pre>'+JSON.stringify({categorias:c.data,produtos:p.data},null,2)+'</pre>';
 }catch(e){
   console.error(e);
   status.className='box err';
   status.textContent='ERRO ❌';
   resultado.innerHTML='<h3>Detalhes do erro</h3><pre>'+String(e.message||e)+'</pre>';
 }
})();
</script>
</body>
</html>
