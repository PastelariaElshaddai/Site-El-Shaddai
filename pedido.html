<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finalizar pedido — Pastelaria El Shaddai</title>
<style>
:root{--red:#c62828;--gold:#ffb300;--cream:#fff8e7;--line:#eadfce;--green:#237b39}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:Arial,sans-serif;color:#242424}.wrap{width:min(760px,92%);margin:20px auto 40px}.top{background:linear-gradient(135deg,#c62828,#e53935,#ffb300);color:#fff;padding:20px;border-radius:18px;text-align:center}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 4px 12px #0000000a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px}.full{grid-column:1/-1}.items{display:grid;gap:8px}.item{padding:10px;border-radius:10px;background:#fffaf0;border:1px solid #eee}.total{font-size:20px;font-weight:800;color:var(--red)}.btn{width:100%;padding:14px;border:0;border-radius:11px;background:var(--gold);font-weight:800;cursor:pointer}.btn.secondary{background:#fff;border:1px solid var(--red);color:var(--red);margin-top:8px}.hidden{display:none}.pix{display:grid;place-items:center;text-align:center;background:#f3f8ff;border:1px solid #d6e5ff;border-radius:12px;padding:14px}.pix img{width:220px;height:220px;background:#fff;padding:8px}.note{padding:11px;border-radius:11px;background:#fff8e7;border:1px solid #f0dfac}.error{padding:11px;border-radius:11px;background:#ffeaea;color:#a00018}.ok{padding:11px;border-radius:11px;background:#eaf8ee;color:#237b39}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1 style="margin:0 0 5px">Finalizar pedido</h1><div>Pastelaria El Shaddai</div></div>
<div id="mensagem"></div>
<div class="card"><h2>Seu pedido</h2><div id="itens" class="items"></div><p class="total">Subtotal: <span id="subtotal">R$ 0,00</span></p><p>Entrega: <span id="frete">R$ 0,00</span></p><p>Desconto: <span id="desconto">R$ 0,00</span></p><p class="total">Total: <span id="total">R$ 0,00</span></p></div>
<div class="card"><h2>Seus dados</h2><div class="grid">
<div class="field"><label>Nome</label><input id="nome" required></div>
<div class="field"><label>Telefone</label><input id="telefone" inputmode="tel" required></div>
<div class="field"><label>Modalidade</label><select id="tipo"><option value="entrega">Entrega</option><option value="retirada">Retirada</option></select></div>
<div class="field" id="bairroWrap"><label>Bairro</label><select id="bairro"><option value="">Selecione o bairro</option></select><input id="bairroOutro" class="hidden" style="margin-top:8px" placeholder="Digite seu bairro"></div>
<div class="field hidden" id="kmWrap"><label>Distância em km</label><input id="kmDistancia" type="number" min="0" step="0.1" placeholder="Ex.: 4,5"></div>
<div class="field full" id="enderecoWrap"><label>Endereço para entrega</label><input id="endereco" placeholder="Rua e número"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><input id="cidade" placeholder="Cidade"><input id="complemento" placeholder="Complemento"></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button id="btnGPS" class="btn secondary" type="button" style="width:auto">Usar minha localização</button><button id="btnVerificarEndereco" class="btn secondary" type="button" style="width:auto">Verificar endereço</button></div><div id="enderecoStatus" class="note hidden" style="margin-top:8px"></div></div>
<div class="field"><label>Pagamento</label><select id="pagamento"><option value="pix">Pix</option><option value="cartao">Cartão</option><option value="dinheiro">Dinheiro</option></select></div><div class="field hidden" id="pixFormaWrap"><label>Pix</label><select id="pixForma"><option value="entrega">Pagar na entrega</option><option value="agora">Pagar agora</option></select></div><div class="field hidden" id="cartaoFormaWrap"><label>Cartão</label><select id="cartaoForma"><option value="credito">Crédito</option><option value="debito">Débito</option></select></div>
<div class="field" id="recebidoWrap"><label>Valor em dinheiro</label><input id="valorRecebido" type="number" min="0" step="0.01" placeholder="Ex.: 50,00"></div>
<div class="field full"><label>Observações</label><textarea id="observacao" rows="3"></textarea></div>
</div></div>
<div class="card"><h2>Cupon</h2><div class="grid"><div class="field"><label>Código</label><input id="cupom" placeholder="Digite seu cupom"></div><div style="display:flex;align-items:end"><button id="btnCupom" class="btn" type="button">Aplicar cupom</button></div></div><div id="cupomMensagem"></div></div>
<div id="pixBox" class="card pix hidden"><h2 style="margin-top:0">Pagar agora por Pix</h2><div id="pixQr"></div><p>Chave Pix: <strong id="pixChave"></strong></p><button id="copiarPix" class="btn" type="button">Copiar chave Pix</button><p class="note">Depois de pagar, envie o comprovante pelo WhatsApp da loja para finalizar o pedido.</p><button id="pixPagamentoFeito" class="btn" type="button">Pagamento feito — voltar ao carrinho</button></div>
<button id="finalizar" class="btn">Finalizar pedido</button>
<button class="btn secondary" onclick="location.href='index.html'">Voltar ao cardápio</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="supabase.js?v=20261005-final1"></script>
<script>
const moeda=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const arr=v=>Array.isArray(v)?v:[];let carrinho=JSON.parse(localStorage.getItem("carrinho")||"[]"),config=null,promocoes=[],produtosCatalogo=[],delivery=null,desconto=0,cupomAplicado=null;let pixConfirmado=sessionStorage.getItem("elshaddai_pix_confirmado")==="1";
const MARKER="ELSHADDAI_CONFIG_V3";
function metaConfig(text){const raw=String(text||""),linhas=raw.split("\n").filter(x=>x.startsWith(MARKER+"|"));for(let i=linhas.length-1;i>=0;i--){try{const x=JSON.parse(linhas[i].slice(MARKER.length+1));if(x&&typeof x==="object")return x}catch{}}return{}}
function normalizarDelivery(d){const x=d?.delivery||d||{};const bairros=x.bairros&&typeof x.bairros==="object"?x.bairros:{};const kmTabela=x.km_tabela||x.kmTabela||{};let mode=x.modo||x.mode||"off";const temBairro=Object.values(bairros).some(v=>v&&v.ativo===true&&Number(v.valor||0)>=0);const temKm=Object.keys(kmTabela).length>0;if(mode==="off"||!mode){if(temBairro&&temKm)mode="bairro_km";else if(temBairro)mode="bairro";else if(temKm)mode="km"}return {mode,kmTabela,kmMax:Number(x.km_max??x.kmMax??0),freeAbove:Number(x.gratis_acima??x.freeAbove??0),minFee:Number(x.taxa_min??x.minFee??0),bairros}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function subtotal(){return carrinho.reduce((s,i)=>s+Number(i.preco||0)*Number(i.quantidade||1),0)}
function mostrarItens(){document.getElementById("itens").innerHTML=carrinho.length?carrinho.map(i=>`<div class="item"><strong>${Number(i.quantidade||1)}x ${esc(i.nome)}</strong><br>${moeda(Number(i.preco||0)*Number(i.quantidade||1))}${arr(i.detalhes).length?"<br><small>"+i.detalhes.map(esc).join(" · ")+"</small>":""}</div>`).join(""):"<div class='note'>Seu carrinho está vazio.</div>"}
function bairrosAtivos(){const out=[];Object.entries(delivery?.bairros||{}).forEach(([key,v])=>{if(!v?.ativo)return;const partes=key.split("|");const cidade=partes.length>1?partes.shift():"";const bairro=partes.join("|")||key;out.push({cidade,bairro,valor:Number(v.valor||0)})});return out}
function popularBairros(){const s=document.getElementById("bairro"),bs=bairrosAtivos();s.innerHTML='<option value="">Selecione o bairro</option>'+bs.map(x=>`<option value="${esc(x.cidade+"|"+x.bairro)}">${esc(x.bairro)} — ${esc(x.cidade)}</option>`).join("")}
function calcularFrete(){
 if(document.getElementById("tipo").value!=="entrega"||config?.entrega_ativa===false)return 0;
 const total=subtotal();if(delivery?.freeAbove&&total>=delivery.freeAbove)return 0;
 const mode=delivery?.mode||"off";let fee=0;
 if(mode==="bairro"||mode==="bairro_km"){const v=document.getElementById("bairro").value;if(!v)return 0;const item=bairrosAtivos().find(x=>x.cidade+"|"+x.bairro===v);if(!item)return 0;fee+=Number(item.valor||0)}
 if(mode==="km"||mode==="bairro_km"){const km=Number(document.getElementById("kmDistancia")?.value||0);if(km<=0)return mode==="bairro_km"?fee:0;if(delivery?.kmMax&&km>delivery.kmMax)return 0;const tabela=delivery?.kmTabela||{};const chaves=Object.keys(tabela).map(Number).filter(Number.isFinite).sort((a,b)=>a-b);let valorKm=0;for(const faixa of chaves){if(km<=faixa){valorKm=Number(tabela[faixa]||0);break}}if(chaves.length&&km>chaves[chaves.length-1])valorKm=Number(tabela[chaves[chaves.length-1]]||0);fee+=valorKm}
 if(mode==="off")return 0;return Math.max(fee,Number(delivery?.minFee||0));
}
function atualizarTotais(){
 const sub=subtotal(),frete=calcularFrete(),base=sub+frete;desconto=cupomAplicado?calcularDesconto(cupomAplicado,base):0;document.getElementById("subtotal").textContent=moeda(sub);document.getElementById("frete").textContent=moeda(frete);document.getElementById("desconto").textContent=moeda(desconto);document.getElementById("total").textContent=moeda(Math.max(0,base-desconto));
}
function metaPromo(p){try{const m=JSON.parse(p.descricao||"");return m?.__elshaddai_promo?m:null}catch{return null}}
function promocaoExpirada(p){return !!(p?.validade&&new Date(String(p.validade)+"T23:59:59")<new Date())}
async function pedidosDaPessoa(tel,endereco){const r=await supabaseClient.from("pedidos").select("id,cliente_telefone,endereco,observacao,criado_em");if(r.error)return[];const alvo=normalizarCheckout(endereco);return (r.data||[]).filter(o=>{let x={};try{x=JSON.parse(o.observacao||"{}")}catch{}return x.modoTeste!==true&&(String(o.cliente_telefone||"")===tel||(alvo&&normalizarCheckout(o.endereco)===alvo))})}
function normalizarCheckout(v){const x=String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();return x==="retirada na loja"?"":x}
async function validarRegra(p,telefone,endereco){
 const m=metaPromo(p),pedidos=await pedidosDaPessoa(telefone,endereco),usos=pedidos.filter(o=>{try{const x=JSON.parse(o.observacao||"");return x?.__elshaddai_pedido?.cupom===p.codigo}catch{return false}}).length;
 if(!m)return {ok:true,meta:{regra:"livre"}};
 if(m.regra==="primeira_compra"&&pedidos.length>0)return {ok:false,msg:"Este cupom é válido somente na primeira compra desta residência/cliente."};
 if(m.regra==="uma_vez_por_cliente"&&usos>0)return {ok:false,msg:"Este cupom já foi utilizado por este cliente."};
 if(m.regra==="a_cada_n"&&usos>=Math.max(1,Number(m.compras_necessarias||1)))return {ok:false,msg:"Este cupom já atingiu o limite de uso para este cliente."};
 return {ok:true,meta:m};
}
function calcularDesconto(p,base){const m=metaPromo(p);if(!m){const percentual=Number(p?.desconto||0);return percentual>0?Math.min(base,base*percentual/100):0}if(m?.tipo==="percentual")return Math.min(base,base*Number(m.valor||0)/100);if(m?.tipo==="valor")return Math.min(base,Number(m.valor||0));if(m?.tipo==="produto"){const prod=produtosCatalogo.find(x=>String(x.id)===String(m.produto_id));if(!prod)return 0;const nomeBase=String(prod.nome||"").trim().toLowerCase();const item=carrinho.find(i=>{const n=String(i.nome||"").trim().toLowerCase();return n===nomeBase||n.startsWith(nomeBase+" -")});return item?Math.min(base,Number(item.preco||0)*Number(item.quantidade||1)):0}return 0}
async function aplicarCupom(){
 const codigo=document.getElementById("cupom").value.trim().toUpperCase(),box=document.getElementById("cupomMensagem");if(!codigo)return;
 const tel=document.getElementById("telefone").value.replace(/\D/g,"");const enderecoCupom=document.getElementById("endereco").value.trim();if(document.getElementById("tipo").value==="entrega"&&!enderecoCupom){box.innerHTML='<div class="note">Informe o endereço antes de aplicar o cupom para validar a regra por residência.</div>';return}const p=promocoes.find(x=>String(x.codigo).toUpperCase()===codigo&&x.ativo!==false&&!promocaoExpirada(x));
 if(!p){cupomAplicado=null;box.innerHTML='<div class="error">Cupom não encontrado ou expirado.</div>';atualizarTotais();return}
 if(!tel){box.innerHTML='<div class="note">Informe o telefone para verificar a regra de uso deste cupom.</div>';return}
 const v=await validarRegra(p,tel,document.getElementById("endereco").value.trim());if(!v.ok){cupomAplicado=null;box.innerHTML='<div class="error">'+v.msg+"</div>";atualizarTotais();return}
 cupomAplicado=p;box.innerHTML='<div class="ok">Cupom aplicado.</div>';atualizarTotais();
}
function mostrarPix(){
 const box=document.getElementById("pixBox"),chave=config?.pix||"";document.getElementById("pixChave").textContent=chave;
 document.getElementById("pixQr").innerHTML="";if(chave&&window.QRCode)new QRCode(document.getElementById("pixQr"),{text:chave,width:220,height:220});
 const pagarAgora=document.getElementById("pagamento").value==="pix"&&document.getElementById("pixForma")?.value==="agora";box.classList.toggle("hidden",!pagarAgora);
 const fin=document.getElementById("finalizar");if(fin){fin.disabled=false;fin.style.display=pagarAgora&&!pixConfirmado?"none":"block";}
 const b=document.getElementById("pixPagamentoFeito");if(b)b.textContent=pixConfirmado?"Pagamento confirmado — voltar ao carrinho":"Pagamento feito — voltar ao carrinho";
}

async function verificarEndereco(){const status=document.getElementById("enderecoStatus"),rua=document.getElementById("endereco")?.value.trim()||"",cidade=document.getElementById("cidade")?.value.trim()||"Fortaleza",bairro=document.getElementById("bairroOutro")?.value.trim()||document.getElementById("bairro")?.selectedOptions?.[0]?.textContent?.split(" — ")[0]||"";if(!rua){status.textContent="Informe a rua e o número primeiro.";status.classList.remove("hidden");return}status.textContent="Verificando endereço...";status.classList.remove("hidden");try{const q=encodeURIComponent([rua,bairro,cidade,"Brasil"].filter(Boolean).join(", "));const r=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q="+q,{headers:{Accept:"application/json"}});const d=await r.json();if(d?.length){status.textContent="Endereço localizado no mapa.";status.classList.remove("error");status.classList.add("ok")}else{status.textContent="Não foi possível confirmar esse endereço. Você ainda pode conferir os dados antes de finalizar.";status.classList.remove("ok");status.classList.add("error")}}catch{status.textContent="A consulta de endereço não está disponível agora. Confira os dados digitados.";status.classList.remove("ok");status.classList.add("error")}}
async function usarGPS(){const status=document.getElementById("enderecoStatus");if(!navigator.geolocation){status.textContent="Seu navegador não disponibiliza GPS.";status.classList.remove("hidden");return}status.textContent="Obtendo localização...";status.classList.remove("hidden");navigator.geolocation.getCurrentPosition(async pos=>{try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&zoom=18&addressdetails=1`,{headers:{Accept:"application/json"}});const d=await r.json();const a=d.address||{};const rua=[a.road,a.house_number].filter(Boolean).join(", ");if(rua)document.getElementById("endereco").value=rua;if(document.getElementById("cidade"))document.getElementById("cidade").value=a.city||a.town||a.municipality||"";status.textContent="Localização encontrada. Confira rua, número e complemento."}catch{status.textContent="Localização obtida, mas não foi possível preencher o endereço automaticamente."}},()=>{status.textContent="Não foi possível acessar sua localização. Você pode preencher o endereço manualmente."},{enableHighAccuracy:true,timeout:10000,maximumAge:60000})}

async function finalizar(){
 const msg=document.getElementById("mensagem");msg.innerHTML="";if(document.getElementById("pagamento").value==="pix"&&document.getElementById("pixForma")?.value==="agora"&&!pixConfirmado){msg.innerHTML='<div class="error">Efetue o Pix e clique em “Pagamento feito — voltar ao carrinho” antes de finalizar o pedido.</div>';return;}
 if(!carrinho.length){msg.innerHTML='<div class="error">O carrinho está vazio.</div>';return}
 if(config?.loja_aberta===false){msg.innerHTML='<div class="error">A loja está fechada no momento.</div>';return}
 const nome=document.getElementById("nome").value.trim(),tel=document.getElementById("telefone").value.replace(/\D/g,""),tipo=document.getElementById("tipo").value,enderecoBase=document.getElementById("endereco").value.trim(),cidade=document.getElementById("cidade")?.value.trim()||"",complemento=document.getElementById("complemento")?.value.trim()||"",pag=document.getElementById("pagamento").value,obs=document.getElementById("observacao").value.trim();const bairroSel=document.getElementById("bairro")?.value||"",bairroNome=bairroSel==="__outro__"?(document.getElementById("bairroOutro")?.value.trim()||""):(document.getElementById("bairro")?.selectedOptions?.[0]?.textContent?.split(" — ")[0]||"");const endereco=[enderecoBase,bairroNome,cidade,complemento].filter(Boolean).join(", ");
 if(!nome||tel.length<10){msg.innerHTML='<div class="error">Informe nome e telefone válidos.</div>';return}
 if(tipo==="entrega"&&!endereco){msg.innerHTML='<div class="error">Informe o endereço para entrega.</div>';return}
 if(tipo==="entrega"&&(delivery?.mode==="bairro"||delivery?.mode==="bairro_km")&&!document.getElementById("bairro").value){msg.innerHTML='<div class="error">Selecione o bairro para calcular a entrega.</div>';return}if(tipo==="entrega"&&document.getElementById("bairro").value==="__outro__"&&!document.getElementById("bairroOutro").value.trim()){msg.innerHTML='<div class="error">Informe seu bairro.</div>';return}
 atualizarTotais();const frete=calcularFrete(),sub=subtotal(),desc=cupomAplicado?calcularDesconto(cupomAplicado,sub+frete):0,total=Math.max(0,sub+frete-desc);
 let recebido=0,troco=0;if(pag==="dinheiro"){recebido=Number(document.getElementById("valorRecebido").value||0);if(recebido<total){msg.innerHTML='<div class="error">O valor recebido é menor que o total.</div>';return}troco=recebido-total}
 const bairroSelecionado=document.getElementById("bairro").value||"",bairroFinal=bairroSelecionado==="__outro__"?document.getElementById("bairroOutro").value.trim():bairroSelecionado;const pagamentoDetalhe=pag==="pix"?(document.getElementById("pixForma")?.value||"entrega"):pag==="cartao"?(document.getElementById("cartaoForma")?.value||"credito"):"dinheiro";const extra={__elshaddai_pedido:1,modoTeste:sessionStorage.getItem("elshaddai_modo_teste")==="1",cupom:cupomAplicado?.codigo||null,subtotal:sub,frete,desconto:desc,valorRecebido:recebido,troco,reembolso:0,observacaoLivre:obs,bairro:bairroFinal||null,pagamentoDetalhe,pixPagoAgora:pag==="pix"&&pagamentoDetalhe==="agora"};
 const pedido={cliente_nome:nome,cliente_telefone:tel,endereco:tipo==="entrega"?endereco:"Retirada na loja",tipo,pagamento:pag+":"+pagamentoDetalhe,observacao:JSON.stringify(extra),itens:carrinho,total,status:"novo"};
 const r=await supabaseClient.from("pedidos").insert(pedido).select("id").single();if(r.error){msg.innerHTML='<div class="error">Não foi possível registrar o pedido: '+esc(r.error.message)+"</div>";return}
 const tracking=location.href.replace(/pedido\.html.*$/,"")+"acompanhar.html?id="+encodeURIComponent(r.data.id);
 const enderecoCliente=tipo==="entrega"?endereco:"Retirada na loja";const modoTeste=extra.modoTeste===true;const todosClientes=modoTeste?{error:true}:await supabaseClient.from("clientes").select("*");if(!modoTeste&&!todosClientes.error){const alvo=normalizarCheckout(enderecoCliente);const existente=(todosClientes.data||[]).find(c=>String(c.telefone||"")===tel||(alvo&&normalizarCheckout(c.endereco)===alvo));if(existente)await supabaseClient.from("clientes").update({nome,endereco:enderecoCliente,telefone:tel,quantidade_pedidos:Number(existente.quantidade_pedidos||0)+1,total_gasto:Number(existente.total_gasto||0)+total}).eq("id",existente.id);else await supabaseClient.from("clientes").insert({nome,telefone:tel,endereco:enderecoCliente,quantidade_pedidos:1,total_gasto:total});}
 localStorage.removeItem("carrinho");carrinho=[];window.carrinho=carrinho;sessionStorage.removeItem("elshaddai_pix_confirmado");pixConfirmado=false;if(modoTeste)sessionStorage.removeItem("elshaddai_modo_teste");
 const wa=String(config?.whatsapp||"").replace(/\D/g,"");
 const texto=`*NÚMERO DO CLIENTE:* ${tel}\n*Cliente:* ${nome}\n*Telefone:* ${tel}\n*Tipo:* ${tipo==="entrega"?"Entrega":"Retirada"}\n*Endereço:* ${tipo==="entrega"?endereco:"Retirada na loja"}\n\n*ITENS*\n${pedido.itens.map(i=>`*${i.quantidade||1}x ${i.nome}* — ${moeda((i.preco||0)*(i.quantidade||1))}${arr(i.detalhes).length?" — "+i.detalhes.join(", "):""}`).join("\n")}\n\n*Subtotal:* ${moeda(sub)}\n*Entrega:* ${moeda(frete)}\n*Desconto:* ${moeda(desc)}\n*TOTAL:* ${moeda(total)}\n*Pagamento:* ${pagamentoDetalhe}${pagamentoDetalhe==="agora"?"\n*Status do pagamento:* Informado como pago — comprovante pendente":"\n*Status do pagamento:* Pagamento na entrega"}${troco?`\n*Recebido:* ${moeda(recebido)}\n*Troco:* ${moeda(troco)}`:""}${obs?`\n*Observação:* ${obs}`:""}\n*ACOMPANHAR PEDIDO:* ${tracking}`;
 if(wa&&!modoTeste)window.open("https://wa.me/"+wa+"?text="+encodeURIComponent(texto),"_blank");
 msg.innerHTML='<div class="ok">Pedido registrado. O WhatsApp foi preparado com o resumo do pedido.</div>'+(pag==="pix"&&pagamentoDetalhe==="agora"?'<p>Envie o comprovante do Pix pelo WhatsApp da loja assim que efetuar o pagamento.</p>':"")+'<p><a href="'+tracking+'">Acompanhar pedido — clique no link abaixo</a></p>';
 document.getElementById("finalizar").disabled=true;
}

function atualizarCheckoutPagamento(){const pag=document.getElementById("pagamento").value;document.getElementById("pixFormaWrap").classList.toggle("hidden",pag!=="pix");document.getElementById("cartaoFormaWrap").classList.toggle("hidden",pag!=="cartao");document.getElementById("recebidoWrap").classList.toggle("hidden",pag!=="dinheiro");mostrarPix();}
async function iniciar(){
 const [rc,rp,rr]=await Promise.all([supabaseClient.from("configuracoes_loja").select("*").order("id",{ascending:true}).limit(1),supabaseClient.from("promocoes").select("*").order("id",{ascending:false}),supabaseClient.from("produtos").select("id,nome,preco").eq("ativo",true)]);
 config=(rc.data||[])[0]||{};promocoes=rp.data||[];produtosCatalogo=rr.data||[];delivery=normalizarDelivery(metaConfig(config.informacoes));
 mostrarItens();popularBairros();const bs=document.getElementById("bairro");if(bs&&!Array.from(bs.options).some(o=>o.value==="__outro__"))bs.insertAdjacentHTML("beforeend",'<option value="__outro__">Outro bairro</option>');atualizarCheckoutPagamento();atualizarTotais();
 document.getElementById("tipo").addEventListener("change",()=>{const entrega=document.getElementById("tipo").value==="entrega";document.getElementById("enderecoWrap").classList.toggle("hidden",!entrega);document.getElementById("bairroWrap").classList.toggle("hidden",!entrega);const kmMode=delivery?.mode==="km"||delivery?.mode==="bairro_km";document.getElementById("kmWrap").classList.toggle("hidden",!entrega||!kmMode);atualizarTotais()});
 document.getElementById("bairro").addEventListener("change",atualizarTotais);document.getElementById("kmDistancia").addEventListener("input",atualizarTotais);document.getElementById("pagamento").addEventListener("change",()=>{if(document.getElementById("pagamento").value!=="pix"){pixConfirmado=false;sessionStorage.removeItem("elshaddai_pix_confirmado")}atualizarCheckoutPagamento();atualizarTotais()});document.getElementById("pixForma")?.addEventListener("change",()=>{if(document.getElementById("pixForma").value!=="agora"){pixConfirmado=false;sessionStorage.removeItem("elshaddai_pix_confirmado")}mostrarPix();atualizarTotais()});document.getElementById("pixPagamentoFeito")?.addEventListener("click",()=>{pixConfirmado=true;sessionStorage.setItem("elshaddai_pix_confirmado","1");mostrarPix();document.getElementById("pixBox")?.classList.add("hidden");document.getElementById("mensagem").innerHTML='<div class="ok">Pagamento marcado como feito. Envie o comprovante pelo WhatsApp da loja e finalize o pedido.</div>'});document.getElementById("cartaoForma")?.addEventListener("change",()=>{atualizarCheckoutPagamento();atualizarTotais()});document.getElementById("bairro").addEventListener("change",()=>{document.getElementById("bairroOutro")?.classList.toggle("hidden",document.getElementById("bairro").value!=="__outro__");atualizarTotais()});document.getElementById("btnCupom").addEventListener("click",aplicarCupom);document.getElementById("finalizar").addEventListener("click",finalizar);
 document.getElementById("btnGPS")?.addEventListener("click",usarGPS);document.getElementById("btnVerificarEndereco")?.addEventListener("click",verificarEndereco);document.getElementById("copiarPix").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(config.pix||"");document.getElementById("pixChave").textContent=(config.pix||"")+" — copiado"}catch{}});
}
document.addEventListener("DOMContentLoaded",iniciar);
</script>
