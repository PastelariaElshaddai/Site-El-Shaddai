<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finalizar pedido — Pastelaria El Shaddai</title>
<style>
:root{--red:#c62828;--gold:#ffb300;--cream:#fff8e7;--line:#eadfce;--green:#237b39}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:Arial,sans-serif;color:#242424}.wrap{width:min(760px,92%);margin:20px auto 40px}.top{background:linear-gradient(135deg,#c62828,#e53935,#ffb300);color:#fff;padding:20px;border-radius:18px;text-align:center}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 4px 12px #0000000a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px}.full{grid-column:1/-1}.items{display:grid;gap:8px}.item{padding:10px;border-radius:10px;background:#fffaf0;border:1px solid #eee}.total{font-size:20px;font-weight:800;color:var(--red)}.btn{width:100%;padding:14px;border:0;border-radius:11px;background:var(--gold);font-weight:800;cursor:pointer}.btn.secondary{background:#fff;border:1px solid var(--red);color:var(--red);margin-top:8px}.hidden{display:none}.pix{display:grid;place-items:center;text-align:center;background:#f3f8ff;border:1px solid #d6e5ff;border-radius:12px;padding:14px}.pix img{width:220px;height:220px;background:#fff;padding:8px}.note{padding:11px;border-radius:11px;background:#fff8e7;border:1px solid #f0dfac}.error{padding:11px;border-radius:11px;background:#ffeaea;color:#a00018}.ok{padding:11px;border-radius:11px;background:#eaf8ee;color:#237b39}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1 style="margin:0 0 5px">Finalizar pedido</h1><div>Pastelaria El Shaddai</div></div>
<div id="mensagem"></div>
<div class="card"><h2>Seu pedido</h2><div id="itens" class="items"></div><p class="total">Subtotal: <span id="subtotal">R$ 0,00</span></p><p>Entrega: <span id="frete">R$ 0,00</span></p><p>Desconto: <span id="desconto">R$ 0,00</span></p><p class="total">Total: <span id="total">R$ 0,00</span></p></div>
<div class="card"><h2>Seus dados</h2><div class="grid">
<div class="field"><label>Nome</label><input id="nome" required></div>
<div class="field"><label>Telefone</label><input id="telefone" inputmode="tel" required></div>
<div class="field"><label>Modalidade</label><select id="tipo"><option value="entrega">Entrega</option><option value="retirada">Retirada</option></select></div>
<div class="field" id="bairroWrap"><label>Bairro</label><select id="bairro"><option value="">Selecione o bairro</option></select></div>
<div class="field hidden" id="kmWrap"><label>Distância em km</label><input id="kmDistancia" type="number" min="0" step="0.1" placeholder="Ex.: 4,5"></div>
<div class="field full" id="enderecoWrap"><label>Endereço para entrega</label><input id="endereco" placeholder="Rua, número, complemento"></div>
<div class="field"><label>Pagamento</label><select id="pagamento"><option value="pix">Pix</option><option value="cartao">Cartão</option><option value="dinheiro">Dinheiro</option></select></div>
<div class="field" id="recebidoWrap"><label>Valor em dinheiro</label><input id="valorRecebido" type="number" min="0" step="0.01" placeholder="Ex.: 50,00"></div>
<div class="field full"><label>Observações</label><textarea id="observacao" rows="3"></textarea></div>
</div></div>
<div class="card"><h2>Cupon</h2><div class="grid"><div class="field"><label>Código</label><input id="cupom" placeholder="Digite seu cupom"></div><div style="display:flex;align-items:end"><button id="btnCupom" class="btn" type="button">Aplicar cupom</button></div></div><div id="cupomMensagem"></div></div>
<div id="pixBox" class="card pix hidden"><h2 style="margin-top:0">Pagar agora por Pix</h2><div id="pixQr"></div><p>Chave Pix: <strong id="pixChave"></strong></p><button id="copiarPix" class="btn" type="button">Copiar chave Pix</button><p class="note">Depois de pagar, envie o comprovante pelo WhatsApp da loja para finalizar o pedido.</p></div>
<button id="finalizar" class="btn">Finalizar pedido</button>
<button class="btn secondary" onclick="location.href='index.html'">Voltar ao cardápio</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="supabase.js?v=20261001-final"></script>
<script>
const moeda=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const arr=v=>Array.isArray(v)?v:[];let carrinho=JSON.parse(localStorage.getItem("carrinho")||"[]"),config=null,promocoes=[],produtosCatalogo=[],delivery=null,desconto=0,cupomAplicado=null;
const MARKER="ELSHADDAI_CONFIG_V3";
function metaConfig(text){const i=String(text||"").indexOf(MARKER);if(i<0)return{};try{return JSON.parse(String(text).slice(i+MARKER.length).trim())||{}}catch{return{}}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function subtotal(){return carrinho.reduce((s,i)=>s+Number(i.preco||0)*Number(i.quantidade||1),0)}
function mostrarItens(){document.getElementById("itens").innerHTML=carrinho.length?carrinho.map(i=>`<div class="item"><strong>${Number(i.quantidade||1)}x ${esc(i.nome)}</strong><br>${moeda(Number(i.preco||0)*Number(i.quantidade||1))}${arr(i.detalhes).length?"<br><small>"+i.detalhes.map(esc).join(" · ")+"</small>":""}</div>`).join(""):"<div class='note'>Seu carrinho está vazio.</div>"}
function bairrosAtivos(){const out=[];Object.entries(delivery?.bairros||{}).forEach(([key,v])=>{if(v?.ativo){const [cidade,...rest]=key.split("|");out.push({cidade,bairro:rest.join("|"),valor:Number(v.valor||0)})}});return out}
function popularBairros(){const s=document.getElementById("bairro"),bs=bairrosAtivos();s.innerHTML='<option value="">Selecione o bairro</option>'+bs.map(x=>`<option value="${esc(x.cidade+"|"+x.bairro)}">${esc(x.bairro)} — ${esc(x.cidade)}</option>`).join("")}
function calcularFrete(){
 if(document.getElementById("tipo").value!=="entrega"||config?.entrega_ativa===false)return 0;
 const total=subtotal();if(delivery?.freeAbove&&total>=delivery.freeAbove)return 0;
 const mode=delivery?.mode||"off";let fee=0;
 if(mode==="bairro"||mode==="bairro_km"){const v=document.getElementById("bairro").value,item=bairrosAtivos().find(x=>x.cidade+"|"+x.bairro===v);fee+=item?item.valor:0}
 if(mode==="km"||mode==="bairro_km"){const km=Number(document.getElementById("kmDistancia")?.value||0);fee+=km*Number(delivery?.kmValue||0);if(delivery?.kmMax&&km>delivery.kmMax)return 0}
 return Math.max(fee,Number(delivery?.minFee||0));
}
function atualizarTotais(){
 const sub=subtotal(),frete=calcularFrete(),base=sub+frete;desconto=cupomAplicado?calcularDesconto(cupomAplicado,base):0;document.getElementById("subtotal").textContent=moeda(sub);document.getElementById("frete").textContent=moeda(frete);document.getElementById("desconto").textContent=moeda(desconto);document.getElementById("total").textContent=moeda(Math.max(0,base-desconto));
}
function metaPromo(p){try{const m=JSON.parse(p.descricao||"");return m?.__elshaddai_promo?m:null}catch{return null}}
async function pedidosDoTelefone(tel){const r=await supabaseClient.from("pedidos").select("id,cliente_telefone,observacao,criado_em").eq("cliente_telefone",tel);return r.error?[]:(r.data||[])}
async function validarRegra(p,telefone){
 const m=metaPromo(p),pedidos=await pedidosDoTelefone(telefone),usos=pedidos.filter(o=>{try{const x=JSON.parse(o.observacao||"");return x?.__elshaddai_pedido?.cupom===p.codigo}catch{return false}}).length;
 if(!m)return {ok:true,meta:{regra:"livre"}};
 if(m.regra==="primeira_compra"&&pedidos.length>0)return {ok:false,msg:"Este cupom é válido somente na primeira compra deste cliente."};
 if(m.regra==="uma_vez_por_cliente"&&usos>0)return {ok:false,msg:"Este cupom já foi utilizado por este cliente."};
 if(m.regra==="a_cada_n"&&usos>=Math.max(1,Number(m.compras_necessarias||1)))return {ok:false,msg:"Este cupom já atingiu o limite de uso para este cliente."};
 return {ok:true,meta:m};
}
function calcularDesconto(p,base){const m=metaPromo(p);if(m?.tipo==="percentual")return Math.min(base,base*Number(m.valor||0)/100);if(m?.tipo==="valor")return Math.min(base,Number(m.valor||0));if(m?.tipo==="produto"){const prod=produtosCatalogo.find(x=>String(x.id)===String(m.produto_id));if(!prod)return 0;const item=carrinho.find(i=>String(i.nome).trim()===String(prod.nome).trim());return item?Math.min(base,Number(item.preco||0)):0}return 0}
async function aplicarCupom(){
 const codigo=document.getElementById("cupom").value.trim().toUpperCase(),box=document.getElementById("cupomMensagem");if(!codigo)return;
 const tel=document.getElementById("telefone").value.replace(/\D/g,"");const p=promocoes.find(x=>String(x.codigo).toUpperCase()===codigo&&x.ativo!==false&&(!x.validade||new Date(x.validade+"T23:59:59")>=new Date()));
 if(!p){cupomAplicado=null;box.innerHTML='<div class="error">Cupom não encontrado ou expirado.</div>';atualizarTotais();return}
 if(!tel){box.innerHTML='<div class="note">Informe o telefone para verificar a regra de uso deste cupom.</div>';return}
 const v=await validarRegra(p,tel);if(!v.ok){cupomAplicado=null;box.innerHTML='<div class="error">'+v.msg+"</div>";atualizarTotais();return}
 cupomAplicado=p;box.innerHTML='<div class="ok">Cupom aplicado.</div>';atualizarTotais();
}
function mostrarPix(){
 const box=document.getElementById("pixBox"),chave=config?.pix||"";document.getElementById("pixChave").textContent=chave;
 document.getElementById("pixQr").innerHTML="";if(chave&&window.QRCode)new QRCode(document.getElementById("pixQr"),{text:chave,width:220,height:220});
 box.classList.toggle("hidden",document.getElementById("pagamento").value!=="pix");
}
async function finalizar(){
 const msg=document.getElementById("mensagem");msg.innerHTML="";
 if(!carrinho.length){msg.innerHTML='<div class="error">O carrinho está vazio.</div>';return}
 if(config?.loja_aberta===false){msg.innerHTML='<div class="error">A loja está fechada no momento.</div>';return}
 const nome=document.getElementById("nome").value.trim(),tel=document.getElementById("telefone").value.replace(/\D/g,""),tipo=document.getElementById("tipo").value,endereco=document.getElementById("endereco").value.trim(),pag=document.getElementById("pagamento").value,obs=document.getElementById("observacao").value.trim();
 if(!nome||tel.length<10){msg.innerHTML='<div class="error">Informe nome e telefone válidos.</div>';return}
 if(tipo==="entrega"&&!endereco){msg.innerHTML='<div class="error">Informe o endereço para entrega.</div>';return}
 if(tipo==="entrega"&&delivery?.mode==="bairro"&&!document.getElementById("bairro").value){msg.innerHTML='<div class="error">Selecione o bairro para calcular a entrega.</div>';return}
 const frete=calcularFrete(),sub=subtotal(),desc=cupomAplicado?calcularDesconto(cupomAplicado,sub+frete):0,total=Math.max(0,sub+frete-desc);
 let recebido=0,troco=0;if(pag==="dinheiro"){recebido=Number(document.getElementById("valorRecebido").value||0);if(recebido<total){msg.innerHTML='<div class="error">O valor recebido é menor que o total.</div>';return}troco=recebido-total}
 const extra={__elshaddai_pedido:1,cupom:cupomAplicado?.codigo||null,subtotal:sub,frete,desconto:desc,valorRecebido:recebido,troco,reembolso:0,observacaoLivre:obs,bairro:document.getElementById("bairro").value||null};
 const pedido={cliente_nome:nome,cliente_telefone:tel,endereco:tipo==="entrega"?endereco:"Retirada na loja",tipo,pagamento:pag,observacao:JSON.stringify(extra),itens:carrinho,total,status:"novo"};
 const r=await supabaseClient.from("pedidos").insert(pedido).select("id").single();if(r.error){msg.innerHTML='<div class="error">Não foi possível registrar o pedido: '+esc(r.error.message)+"</div>";return}
 const tracking=location.href.replace(/pedido\.html.*$/,"")+"acompanhar.html?id="+encodeURIComponent(r.data.id);
 const cr=await supabaseClient.from("clientes").select("*").eq("telefone",tel).limit(1);
 if(!cr.error){const existente=(cr.data||[])[0];if(existente)await supabaseClient.from("clientes").update({nome,endereco:tipo==="entrega"?endereco:"Retirada na loja",quantidade_pedidos:Number(existente.quantidade_pedidos||0)+1,total_gasto:Number(existente.total_gasto||0)+total}).eq("id",existente.id);else await supabaseClient.from("clientes").insert({nome,telefone:tel,endereco:tipo==="entrega"?endereco:"Retirada na loja",quantidade_pedidos:1,total_gasto:total});}
 localStorage.removeItem("carrinho");carrinho=[];
 const wa=String(config?.whatsapp||"").replace(/\D/g,"");
 const texto=`*PEDIDO #${r.data.id}*\n*Cliente:* ${nome}\n*Telefone:* ${tel}\n*Tipo:* ${tipo==="entrega"?"Entrega":"Retirada"}\n*Endereço:* ${tipo==="entrega"?endereco:"Retirada na loja"}\n\n*ITENS*\n${pedido.itens.map(i=>`*${i.quantidade||1}x ${i.nome}* — ${moeda((i.preco||0)*(i.quantidade||1))}${arr(i.detalhes).length?" — "+i.detalhes.join(", "):""}`).join("\n")}\n\n*Subtotal:* ${moeda(sub)}\n*Entrega:* ${moeda(frete)}\n*Desconto:* ${moeda(desc)}\n*TOTAL:* ${moeda(total)}\n*Pagamento:* ${pag}${troco?`\n*Recebido:* ${moeda(recebido)}\n*Troco:* ${moeda(troco)}`:""}${obs?`\n*Observação:* ${obs}`:""}\n*ACOMPANHAR:* ${tracking}`;
 if(wa)window.open("https://wa.me/"+wa+"?text="+encodeURIComponent(texto),"_blank");
 msg.innerHTML='<div class="ok">Pedido registrado. O WhatsApp foi preparado com o resumo do pedido.</div><p><a href="'+tracking+'">Abrir acompanhamento do pedido</a></p>';
 document.getElementById("finalizar").disabled=true;
}
async function iniciar(){
 const [rc,rp,rr]=await Promise.all([supabaseClient.from("configuracoes_loja").select("*").order("id",{ascending:true}).limit(1),supabaseClient.from("promocoes").select("*").order("id",{ascending:false}),supabaseClient.from("produtos").select("id,nome,preco").eq("ativo",true)]);
 config=(rc.data||[])[0]||{};promocoes=rp.data||[];produtosCatalogo=rr.data||[];delivery=metaConfig(config.informacoes).delivery||{mode:"off",bairros:{}};
 mostrarItens();popularBairros();atualizarTotais();mostrarPix();
 document.getElementById("tipo").addEventListener("change",()=>{const entrega=document.getElementById("tipo").value==="entrega";document.getElementById("enderecoWrap").classList.toggle("hidden",!entrega);document.getElementById("bairroWrap").classList.toggle("hidden",!entrega);const kmMode=delivery?.mode==="km"||delivery?.mode==="bairro_km";document.getElementById("kmWrap").classList.toggle("hidden",!entrega||!kmMode);atualizarTotais()});
 document.getElementById("bairro").addEventListener("change",atualizarTotais);document.getElementById("kmDistancia").addEventListener("input",atualizarTotais);document.getElementById("pagamento").addEventListener("change",()=>{mostrarPix();document.getElementById("recebidoWrap").classList.toggle("hidden",document.getElementById("pagamento").value!=="dinheiro")});document.getElementById("btnCupom").addEventListener("click",aplicarCupom);document.getElementById("finalizar").addEventListener("click",finalizar);
 document.getElementById("copiarPix").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(config.pix||"");document.getElementById("pixChave").textContent=(config.pix||"")+" — copiado"}catch{}});
}
document.addEventListener("DOMContentLoaded",iniciar);
</script>
</body>
</html>
