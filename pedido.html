<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finalizar Pedido - Pastelaria El Shaddai</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff8e1;color:#222}header{background:linear-gradient(135deg,#e53935,#ffb300);color:#fff;text-align:center;padding:25px 20px}header h1{margin:0 0 8px;font-size:28px}header p{margin:0}.container{width:92%;max-width:650px;margin:25px auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 5px 20px rgba(0,0,0,.12);border:2px solid #ffb300}h2{color:#d84315}h3{color:#e65100}.grupo{margin-bottom:18px}.grupo label,.title{display:block;font-weight:bold;margin-bottom:7px}input,textarea,select{width:100%;padding:13px;border:1px solid #ccc;border-radius:9px;font-size:16px;background:#fffdf7}textarea{min-height:90px;resize:vertical}.opcoes{display:flex;gap:10px}.opcao{flex:1;border:2px solid #ddd;border-radius:10px;padding:13px;text-align:center;cursor:pointer}.opcao input,.pagamento input,.subopcao input{width:auto}.resumo{margin-top:25px;padding:18px;background:#fff8e1;border:1px solid #ffcc80;border-radius:12px}#listaPedido{line-height:1.6}.total{font-size:22px;font-weight:bold;color:#d84315;margin-top:15px}.pagamento{display:grid;gap:10px}.pagamento>label{background:#fff;border:2px solid #ddd;border-radius:10px;padding:14px;font-size:17px;cursor:pointer}.subopcoes,#areaTroco,#areaPix{display:none;background:#fff8e1;border:1px solid #ffcc80;border-radius:10px;padding:12px;margin-top:-4px}.subopcao{display:block;padding:10px;cursor:pointer;font-size:16px}.info{font-size:14px;color:#666;margin:6px 0 0 28px}.cupom{display:flex;gap:8px}.cupom button{white-space:nowrap}.btn{padding:13px 16px;border:0;border-radius:9px;font-size:16px;font-weight:bold;cursor:pointer}.primary{background:#ffb300}.danger{background:#e53935;color:white}.light{background:white;border:1px solid #ddd}.botao-enviar{width:100%;padding:16px;margin-top:20px;border:0;border-radius:10px;background:linear-gradient(135deg,#e53935,#ffb300);color:white;font-size:18px;font-weight:bold;cursor:pointer}.botao-voltar{width:100%;padding:13px;margin-top:10px;border:1px solid #ddd;border-radius:10px;background:white;color:#555;font-size:16px;cursor:pointer}.notice{padding:12px;border-radius:10px;background:#fff3cd;border:1px solid #ffe08a;margin-top:10px}.ok{padding:12px;border-radius:10px;background:#e8f5e9;border:1px solid #a5d6a7;color:#2e7d32;margin-top:10px}.linha-resumo{display:flex;justify-content:space-between;gap:10px;margin:7px 0}.linha-resumo strong{color:#c62828}@media(max-width:520px){.container{width:95%;padding:16px}.opcoes{flex-direction:column}.cupom{flex-direction:column}.cupom button{width:100%}}
</style>
</head>
<body>
<header><h1 id="lojaNome">Pastelaria El Shaddai</h1><p id="lojaSlogan">Feito a dois, no ponto pra você!</p></header>
<div class="container">
<h2>Finalizar Pedido</h2>
<h3>Dados do cliente</h3>
<div class="grupo"><label for="nome">Nome</label><input id="nome" type="text" placeholder="Seu nome"></div>
<div class="grupo"><label for="telefone">Telefone</label><input id="telefone" type="tel" placeholder="Seu telefone"></div>
<h3>Como deseja receber?</h3>
<div class="opcoes">
<label class="opcao"><input type="radio" name="tipo" value="Entrega" checked onchange="mostrarEndereco()"> Entrega</label>
<label class="opcao"><input type="radio" name="tipo" value="Retirada" onchange="mostrarEndereco()"> Retirada</label>
</div>
<div id="areaEndereco">
<h3>Endereço de entrega</h3>
<div class="grupo"><label for="rua">Rua</label><input id="rua" placeholder="Nome da rua"></div>
<div class="grupo"><label for="numero">Número</label><input id="numero" placeholder="Número"></div>
<div class="grupo"><label for="complemento">Complemento</label><input id="complemento" placeholder="Casa, apartamento, bloco..."></div>
<div class="grupo"><label for="referencia">Ponto de referência</label><input id="referencia" placeholder="Ex.: perto da praça"></div>
<div class="grupo"><label for="bairro">Bairro</label><input id="bairro" placeholder="Seu bairro"></div>
</div>
<h3>Promoção / Cupom</h3>
<div id="promocoesCheckout"></div>
<div class="grupo"><div class="cupom"><input id="codigoCupom" placeholder="Digite seu cupom"><button class="btn primary" type="button" onclick="aplicarCupom()">Aplicar</button></div><div id="resultadoCupom"></div></div>
<h3>Forma de pagamento</h3>
<div class="pagamento">
<label><input type="radio" name="pagamento" value="Pix" onchange="mostrarOpcoesPagamento()"> Pix<p class="info">Você poderá pagar agora ou na entrega.</p></label>
<div id="opcoesPix" class="subopcoes"><label class="subopcao"><input type="radio" name="pixQuando" value="Agora"> Pagar agora</label><label class="subopcao"><input type="radio" name="pixQuando" value="Entrega"> Pagar na entrega</label><div id="pixInfo" class="info"></div></div>
<label><input type="radio" name="pagamento" value="Cartão" onchange="mostrarOpcoesPagamento()"> Cartão<p class="info">Crédito ou débito — pagamento na entrega.</p></label>
<div id="opcoesCartao" class="subopcoes"><label class="subopcao"><input type="radio" name="cartaoTipo" value="Crédito"> Crédito</label><label class="subopcao"><input type="radio" name="cartaoTipo" value="Débito"> Débito</label></div>
<label><input type="radio" name="pagamento" value="Dinheiro" onchange="mostrarOpcoesPagamento()"> Dinheiro<p class="info">Pagamento na entrega.</p></label>
</div>
<div id="areaTroco"><div class="grupo"><label for="troco">Troco para quanto?</label><input id="troco" placeholder="Ex.: R$ 50,00"></div></div>
<div class="grupo"><label for="observacao">Observações</label><textarea id="observacao" placeholder="Alguma observação sobre seu pedido?"></textarea></div>
<div id="avisoFidelidade"></div>
<div class="resumo"><h3>Resumo do pedido</h3><div id="listaPedido">Carregando pedido...</div><div id="linhasValores"></div><div class="total" id="totalPedido">Total: R$ 0,00</div></div>
<button class="botao-enviar" onclick="enviarPedido()">Confirmar pedido e enviar pelo WhatsApp</button>
<button class="botao-voltar" onclick="window.location.href='index.html'">Voltar para o cardápio</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
let carrinho=JSON.parse(localStorage.getItem('carrinho')||'[]');
let configLoja=null, promocoes=[], cupomAplicado=null, subtotal=0, desconto=0, taxaEntrega=0;
const moeda=v=>'R$ '+Number(v||0).toFixed(2).replace('.',',');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function tipoRecebimento(){return document.querySelector('input[name="tipo"]:checked')?.value||'Entrega'}
function mostrarEndereco(){document.getElementById('areaEndereco').style.display=tipoRecebimento()==='Entrega'?'block':'none';calcularResumo()}
function mostrarOpcoesPagamento(){const p=document.querySelector('input[name="pagamento"]:checked')?.value;document.getElementById('opcoesPix').style.display=p==='Pix'?'block':'none';document.getElementById('opcoesCartao').style.display=p==='Cartão'?'block':'none';document.getElementById('areaTroco').style.display=p==='Dinheiro'?'block':'none'}
function calcularSubtotal(){return carrinho.reduce((s,i)=>s+Number(i.preco||0)*Number(i.quantidade||1),0)}
function calcularDesconto(){if(!cupomAplicado)return 0;const tipo=cupomAplicado._tipo||'percentual';const valor=Number(cupomAplicado.desconto||0);if(tipo==='valor')return Math.min(subtotal,Math.max(0,valor));if(tipo==='percentual')return Math.min(subtotal,subtotal*valor/100);return 0}
function calcularResumo(){subtotal=calcularSubtotal();desconto=calcularDesconto();const total=Math.max(0,subtotal+taxaEntrega-desconto);document.getElementById('totalPedido').textContent='Total: '+moeda(total);document.getElementById('linhasValores').innerHTML=`<div class="linha-resumo"><span>Subtotal</span><strong>${moeda(subtotal)}</strong></div><div class="linha-resumo"><span>Entrega</span><strong>${taxaEntrega?moeda(taxaEntrega):'Grátis'}</strong></div><div class="linha-resumo"><span>Desconto</span><strong>${desconto?'- '+moeda(desconto):moeda(0)}</strong></div>`}
function mostrarResumo(){const box=document.getElementById('listaPedido');if(!carrinho.length){box.innerHTML='Seu carrinho está vazio.';calcularResumo();return}box.innerHTML=carrinho.map(i=>{const q=Number(i.quantidade||1),p=Number(i.preco||0);return `<div style="margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #ddd"><strong>${q}x ${esc(i.nome)}</strong><br><span>${moeda(p)} cada</span><br><strong style="color:#c62828">Subtotal: ${moeda(p*q)}</strong>${i.detalhes?.length?`<br><small>${i.detalhes.map(esc).join('<br>')}</small>`:''}</div>`}).join('');calcularResumo()}
async function carregarLoja(){try{const r=await supabaseClient.from('configuracoes_loja').select('*').limit(1);if(!r.error&&r.data?.length){configLoja=r.data[0];document.getElementById('lojaNome').textContent=configLoja.nome_loja||'Pastelaria El Shaddai';document.getElementById('lojaSlogan').textContent=configLoja.slogan||'Feito a dois, no ponto pra você!';if(configLoja.pix)document.getElementById('pixInfo').textContent='Chave Pix: '+configLoja.pix}}catch(e){console.warn(e)}}
async function carregarPromocoes(){try{const r=await supabaseClient.from('promocoes').select('*').eq('ativo',true).order('id',{ascending:false});if(!r.error)promocoes=r.data||[]}catch(e){console.warn(e)}}
function renderPromocoesCheckout(){const box=document.getElementById('promocoesCheckout');if(!box)return;const agora=new Date();const lista=promocoes.filter(p=>p.ativo!==false&&(!p.validade||new Date(String(p.validade)+'T23:59:59')>=agora));if(!lista.length){box.innerHTML='<div class="info" style="margin:0 0 10px 0">Nenhuma promoção ativa no momento.</div>';return}box.innerHTML=lista.map(p=>{const m=interpretarPromo(p);const b=m._tipo==='percentual'?Number(p.desconto||0)+'% de desconto':m._tipo==='valor'?moeda(p.desconto)+' de desconto':'A cada '+Number(m.quantidade||0)+' compra(s): '+esc(m.premioNome||'benefício');return '<div class="notice" style="margin-bottom:8px"><strong>'+esc(p.codigo||'Oferta')+'</strong> — '+esc(b)+(m.descricao?'<br><small>'+esc(m.descricao)+'</small>':'')+(p.validade?'<br><small>Válido até '+esc(p.validade)+'</small>':'')+'</div>'}).join('')}
function interpretarPromo(p){const d=String(p.descricao||'');let m=d.match(/^__ELSHADAI_PROMO_V2__(.*)$/);if(!m)m=d.match(/\[PROMO_META\](.*?)\[\/PROMO_META\]/);if(!m)return {...p,_tipo:'percentual'};try{const meta=JSON.parse(m[1]);return {...p,...meta,_tipo:meta.tipo||'percentual'}}catch{return {...p,_tipo:'percentual'}}}
async function aplicarCupom(){const codigo=document.getElementById('codigoCupom').value.trim().toUpperCase();const out=document.getElementById('resultadoCupom');if(!codigo){out.innerHTML='<div class="notice">Digite um código.</div>';return}const bruto=promocoes.find(p=>String(p.codigo).toUpperCase()===codigo);if(!bruto){cupomAplicado=null;out.innerHTML='<div class="notice">Cupom não encontrado ou inativo.</div>';calcularResumo();return}const p=interpretarPromo(bruto);if(p.validade&&new Date(p.validade+'T23:59:59')<new Date()){cupomAplicado=null;out.innerHTML='<div class="notice">Esse cupom está vencido.</div>';calcularResumo();return}if(p._tipo==='quantidade'){out.innerHTML='<div class="notice">Este código é uma promoção por quantidade de compras e será aplicado conforme a regra cadastrada. Nesta etapa, o benefício será registrado no pedido para conferência no ADM.</div>';cupomAplicado=p;desconto=0}else{cupomAplicado=p;desconto=calcularDesconto();out.innerHTML=`<div class="ok">Cupom <strong>${esc(codigo)}</strong> aplicado: ${p._tipo==='valor'?moeda(p.desconto):Number(p.desconto||0)+'%'} de desconto.</div>`}calcularResumo()}
async function buscarOuCriarCliente(nome,telefone,endereco){const q=await supabaseClient.from('clientes').select('*').eq('telefone',telefone).limit(1);if(q.error)throw q.error;const existente=q.data?.[0];if(existente){const r=await supabaseClient.from('clientes').update({nome,endereco:endereco||existente.endereco}).eq('id',existente.id).select().single();if(r.error)throw r.error;return r.data}const r=await supabaseClient.from('clientes').insert({nome,telefone,endereco:endereco||null,quantidade_pedidos:0,total_gasto:0}).select().single();if(r.error)throw r.error;return r.data}
function montarEndereco(tipo){if(tipo!=='Entrega')return 'Retirada na loja';const rua=document.getElementById('rua').value.trim(),numero=document.getElementById('numero').value.trim(),bairro=document.getElementById('bairro').value.trim(),comp=document.getElementById('complemento').value.trim(),ref=document.getElementById('referencia').value.trim();if(!rua||!numero||!bairro)return null;return [rua+', '+numero,bairro,comp?'Complemento: '+comp:'',ref?'Referência: '+ref:''].filter(Boolean).join(' - ')}
function dadosPagamento(){const p=document.querySelector('input[name="pagamento"]:checked');if(!p)return null;let texto=p.value, status='PENDENTE';if(p.value==='Pix'){const q=document.querySelector('input[name="pixQuando"]:checked');if(!q)throw new Error('Escolha se o Pix será pago agora ou na entrega.');texto+=' — '+(q.value==='Agora'?'Pagar agora':'Pagar na entrega');if(q.value==='Agora')status='AGUARDANDO COMPROVANTE'}if(p.value==='Cartão'){const q=document.querySelector('input[name="cartaoTipo"]:checked');if(!q)throw new Error('Escolha Crédito ou Débito.');texto+=' — '+q.value+' / pagar na entrega'}if(p.value==='Dinheiro'){const t=document.getElementById('troco').value.trim();if(!t)throw new Error('Informe para quanto precisa de troco.');texto+=' — Troco para '+t}return {texto,status}}
function montarMensagem(dados,numeroPedido){let m='*NOVO PEDIDO - PASTELARIA EL SHADDAI*\n\n';m+='*Pedido:* #'+numeroPedido+'\n';m+='*Cliente:* '+dados.nome+'\n';m+='*Telefone:* '+dados.telefone+'\n';m+='*Recebimento:* '+dados.tipo+'\n';if(dados.endereco)m+='*Endereço:* '+dados.endereco+'\n';m+='\n*ITENS:*\n';dados.itens.forEach(i=>{const q=Number(i.quantidade||1),sub=Number(i.preco||0)*q;m+='• '+q+'x '+i.nome+' — '+moeda(sub)+'\n';if(i.detalhes?.length)m+='  '+i.detalhes.join(' | ')+'\n'});m+='\n*Subtotal:* '+moeda(dados.subtotal)+'\n';m+='*Entrega:* '+(dados.taxaEntrega?moeda(dados.taxaEntrega):'Grátis')+'\n';m+='*Desconto:* '+(dados.desconto?'- '+moeda(dados.desconto):moeda(0))+'\n';if(dados.cupom)m+='*Cupom:* '+dados.cupom+'\n';m+='*TOTAL:* '+moeda(dados.total)+'\n';m+='\n*Pagamento:* '+dados.pagamento+'\n';m+='*Status do pagamento:* '+dados.pagamentoStatus+'\n';if(dados.proximoBeneficio)m+='*Fidelidade:* '+dados.proximoBeneficio+'\n';if(dados.observacao)m+='\n*Observações:*\n'+dados.observacao+'\n';return m}
async function enviarPedido(){try{if(!carrinho.length){alert('Seu carrinho está vazio.');return}const nome=document.getElementById('nome').value.trim(),telefone=document.getElementById('telefone').value.trim(),tipo=tipoRecebimento();if(!nome)return alert('Digite seu nome.');if(!telefone)return alert('Digite seu telefone.');const endereco=montarEndereco(tipo);if(!endereco)return alert('Preencha rua, número e bairro.');if(tipo==='Retirada')document.getElementById('areaEndereco').style.display='none';const pg=dadosPagamento();if(!pg)return alert('Escolha a forma de pagamento.');subtotal=calcularSubtotal();desconto=calcularDesconto();const total=Math.max(0,subtotal+taxaEntrega-desconto);const observacao=document.getElementById('observacao').value.trim();const meta={itens:carrinho,subtotal,taxaEntrega,desconto,cupom:cupomAplicado?.codigo||null,promocao:cupomAplicado||null,pagamentoStatus:pg.status};const cliente=await buscarOuCriarCliente(nome,telefone,endereco);const payload={cliente_nome:nome,cliente_telefone:telefone,endereco,tipo,pagamento:pg.texto,observacao:[observacao,cupomAplicado?'Cupom: '+cupomAplicado.codigo:'',cupomAplicado?('Desconto: '+moeda(desconto)):'', 'Status pagamento: '+pg.status].filter(Boolean).join('\n'),itens:meta,total,status:'novo'};const r=await supabaseClient.from('pedidos').insert(payload).select().single();if(r.error)throw r.error;const numeroPedido=r.data.id;const novosPedidos=Number(cliente.quantidade_pedidos||0)+1;const novoTotal=Number(cliente.total_gasto||0)+Number(total||0);const ur=await supabaseClient.from('clientes').update({quantidade_pedidos:novosPedidos,total_gasto:novoTotal}).eq('id',cliente.id);if(ur.error)console.warn('Pedido salvo, mas não foi possível atualizar a fidelidade:',ur.error);const metaFidelidade=Number(localStorage.getItem('elshaddai_fidelidade_meta')||10);const beneficio=Number(cliente.quantidade_pedidos||0)+1;const faltam=metaFidelidade-(beneficio%metaFidelidade||metaFidelidade);const dados={nome,telefone,tipo,endereco,itens:carrinho,subtotal,taxaEntrega,desconto,total,cupom:cupomAplicado?.codigo||'',pagamento:pg.texto,pagamentoStatus:pg.status,observacao,proximoBeneficio:beneficio%metaFidelidade===0?'Meta de fidelidade alcançada!':('Faltam '+faltam+' compra(s) para o próximo benefício.')};const numero=(configLoja?.whatsapp||'5585988944421').replace(/\D/g,'');const url='https://api.whatsapp.com/send?phone='+encodeURIComponent(numero)+'&text='+encodeURIComponent(montarMensagem(dados,numeroPedido));localStorage.removeItem('carrinho');window.open(url,'_blank');alert('Pedido #'+numeroPedido+' registrado com sucesso!');window.location.href='index.html'}catch(e){console.error(e);alert('Não foi possível registrar o pedido.\n\n'+(e.message||e))}}
async function carregarFidelidadeCliente(){const tel=document.getElementById('telefone').value.trim();const box=document.getElementById('avisoFidelidade');if(!tel){box.innerHTML='';return}try{const r=await supabaseClient.from('clientes').select('nome,quantidade_pedidos,total_gasto').eq('telefone',tel).limit(1);if(r.error||!r.data?.length){box.innerHTML='';return}const c=r.data[0],meta=Number(localStorage.getItem('elshaddai_fidelidade_meta')||10),n=Number(c.quantidade_pedidos||0),f=Math.floor(n/meta),rest=Math.max(0,meta-(n%meta));box.innerHTML=f?'<div class="ok"><strong>Cliente fiel:</strong> você já conquistou '+f+' benefício(s). Total de compras: '+n+'.</div>':'<div class="notice">Você já tem '+n+' compra(s). Faltam '+rest+' para o próximo benefício.</div>'}catch(e){box.innerHTML=''}}
document.getElementById('telefone').addEventListener('blur',carregarFidelidadeCliente);document.addEventListener('DOMContentLoaded',async()=>{mostrarEndereco();mostrarOpcoesPagamento();mostrarResumo();await Promise.all([carregarLoja(),carregarPromocoes()]);renderPromocoesCheckout();calcularResumo()});
</script>
</body>
</html>
