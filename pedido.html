<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Finalizar Pedido - Pastelaria El Shaddai</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #fff8e1;
    color: #222;
}

header {
    background: linear-gradient(135deg,#e53935,#ffb300);
    color: white;
    text-align: center;
    padding: 25px 20px;
}

header h1 {
    margin: 0 0 8px;
    font-size: 28px;
}

header p {
    margin: 0;
}

.container {
    width: 92%;
    max-width: 600px;
    margin: 25px auto;
    background: white;
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 5px 20px rgba(0,0,0,.12);
    border: 2px solid #ffb300;
}

h2 {
    color: #d84315;
}

h3 {
    color: #e65100;
}

.grupo {
    margin-bottom: 18px;
}

.grupo label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input,
textarea,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 9px;
    font-size: 16px;
    background: #fffdf7;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

.opcoes {
    display: flex;
    gap: 10px;
}

.opcao {
    flex: 1;
    border: 2px solid #ddd;
    border-radius: 10px;
    padding: 13px;
    text-align: center;
    cursor: pointer;
}

.opcao input {
    width: auto;
}

.resumo {
    margin-top: 25px;
    padding: 18px;
    background: #fff8e1;
    border: 1px solid #ffcc80;
    border-radius: 12px;
}

#listaPedido {
    line-height: 1.6;
}

.total {
    font-size: 22px;
    font-weight: bold;
    color: #d84315;
    margin-top: 15px;
}

.pagamento {
    display: grid;
    gap: 10px;
}

.pagamento > label {
    background: #fff;
    border: 2px solid #ddd;
    border-radius: 10px;
    padding: 14px;
    font-size: 17px;
    cursor: pointer;
}

.pagamento input {
    width: auto;
    margin-right: 8px;
}

.subopcoes {
    display: none;
    background: #fff8e1;
    border: 1px solid #ffcc80;
    border-radius: 10px;
    padding: 12px;
    margin-top: -4px;
}

.subopcao {
    display: block;
    padding: 10px;
    cursor: pointer;
    font-size: 16px;
}

.subopcao input {
    width: auto;
    margin-right: 8px;
}

#areaTroco {
    display: none;
    margin-top: 12px;
    background: #fff8e1;
    border: 1px solid #ffcc80;
    border-radius: 10px;
    padding: 12px;
}

.info-pagamento {
    font-size: 14px;
    color: #666;
    margin: 4px 0 0 28px;
}

.botao-enviar {
    width: 100%;
    padding: 16px;
    margin-top: 20px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg,#e53935,#ffb300);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.botao-voltar {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: 1px solid #ddd;
    border-radius: 10px;
    background: white;
    color: #555;
    font-size: 16px;
    cursor: pointer;
}

</style>

</head>

<body>

<header>

<h1>Pastelaria El Shaddai</h1>

<p>Feito a dois, no ponto pra você!</p>

</header>


<div class="container">

<h2>Finalizar Pedido</h2>


<!-- =====================================
     DADOS DO CLIENTE
===================================== -->

<h3>Dados do cliente</h3>

<div class="grupo">

<label for="nome">
Nome
</label>

<input
type="text"
id="nome"
placeholder="Seu nome"
>

</div>


<div class="grupo">

<label for="telefone">
Telefone
</label>

<input
type="tel"
id="telefone"
placeholder="Seu telefone"
>

</div>


<!-- =====================================
     ENTREGA
===================================== -->

<h3>
Como deseja receber?
</h3>

<div class="opcoes">

<label class="opcao">

<input
type="radio"
name="tipo"
value="Entrega"
checked
onchange="mostrarEndereco()"
>

Entrega

</label>


<label class="opcao">

<input
type="radio"
name="tipo"
value="Retirada"
onchange="mostrarEndereco()"
>

Retirada

</label>

</div>


<!-- =====================================
     ENDEREÇO
===================================== -->

<div id="areaEndereco">

<h3>
Endereço de entrega
</h3>


<div class="grupo">

<label for="rua">
Rua
</label>

<input
type="text"
id="rua"
placeholder="Nome da rua"
>

</div>


<div class="grupo">

<label for="numero">
Número
</label>

<input
type="text"
id="numero"
placeholder="Número"
>

</div>


<div class="grupo">

<label for="complemento">
Complemento
</label>

<input
type="text"
id="complemento"
placeholder="Casa, apartamento, bloco..."
>

</div>


<div class="grupo">

<label for="referencia">
Ponto de referência
</label>

<input
type="text"
id="referencia"
placeholder="Ex.: perto da praça"
>

</div>


<div class="grupo">

<label for="bairro">
Bairro
</label>

<input
type="text"
id="bairro"
placeholder="Seu bairro"
>

</div>

</div>


<!-- =====================================
     PAGAMENTO
===================================== -->

<h3>
Forma de pagamento
</h3>

<div class="pagamento">


<!-- PIX -->

<label>

<input
type="radio"
name="pagamento"
value="Pix"
onchange="mostrarOpcoesPagamento()"
>

Pix

</label>


<div
id="opcoesPix"
class="subopcoes"
>

<label class="subopcao">

<input
type="radio"
name="pixQuando"
value="Agora"
>

Pagar agora

</label>


<label class="subopcao">

<input
type="radio"
name="pixQuando"
value="Entrega"
>

Pagar na entrega

</label>

</div>


<!-- CARTÃO -->

<label>

<input
type="radio"
name="pagamento"
value="Cartão"
onchange="mostrarOpcoesPagamento()"
>

Cartão

<p class="info-pagamento">
Crédito ou débito — pagamento na entrega
</p>

</label>


<div
id="opcoesCartao"
class="subopcoes"
>

<label class="subopcao">

<input
type="radio"
name="cartaoTipo"
value="Crédito"
>

Crédito

</label>


<label class="subopcao">

<input
type="radio"
name="cartaoTipo"
value="Débito"
>

Débito

</label>

</div>


<!-- DINHEIRO -->

<label>

<input
type="radio"
name="pagamento"
value="Dinheiro"
onchange="mostrarOpcoesPagamento()"
>

Dinheiro

<p class="info-pagamento">
Pagamento na entrega
</p>

</label>


</div>


<!-- =====================================
     TROCO
===================================== -->

<div
id="areaTroco"
>

<div class="grupo">

<label for="troco">
Troco para quanto?
</label>

<input
type="text"
id="troco"
placeholder="Ex.: R$ 50,00"
>

</div>

</div>


<!-- =====================================
     OBSERVAÇÃO
===================================== -->

<div class="grupo">

<label for="observacao">
Observações
</label>

<textarea
id="observacao"
placeholder="Alguma observação sobre seu pedido?"
></textarea>

</div>


<!-- =====================================
     RESUMO
===================================== -->

<div class="resumo">

<h3>
Resumo do pedido
</h3>

<div id="listaPedido">
Carregando pedido...
</div>

<div
class="total"
id="totalPedido">

Total: R$ 0,00

</div>

</div>


<!-- =====================================
     BOTÕES
===================================== -->

<button
class="botao-enviar"
onclick="enviarPedido()">

Enviar pedido pelo WhatsApp

</button>


<button
class="botao-voltar"
onclick="window.location.href='index.html'">

Voltar para o cardápio

</button>

</div>


<script>

// ==========================================
// CARRINHO
// ==========================================

let carrinho =
JSON.parse(
localStorage.getItem("carrinho")
) || [];


// ==========================================
// ENTREGA / RETIRADA
// ==========================================

function mostrarEndereco() {

    const tipo =
    document.querySelector(
        'input[name="tipo"]:checked'
    ).value;

    const area =
    document.getElementById(
        "areaEndereco"
    );

    if (tipo === "Entrega") {

        area.style.display = "block";

    } else {

        area.style.display = "none";

    }

}


// ==========================================
// PAGAMENTO
// ==========================================

function mostrarOpcoesPagamento() {

    const pagamento =
    document.querySelector(
        'input[name="pagamento"]:checked'
    );

    const opcoesPix =
    document.getElementById(
        "opcoesPix"
    );

    const opcoesCartao =
    document.getElementById(
        "opcoesCartao"
    );

    const areaTroco =
    document.getElementById(
        "areaTroco"
    );


    // Esconder tudo primeiro

    opcoesPix.style.display = "none";

    opcoesCartao.style.display = "none";

    areaTroco.style.display = "none";


    // PIX

    if (
        pagamento &&
        pagamento.value === "Pix"
    ) {

        opcoesPix.style.display = "block";

    }


    // CARTÃO

    if (
        pagamento &&
        pagamento.value === "Cartão"
    ) {

        opcoesCartao.style.display = "block";

    }


    // DINHEIRO

    if (
        pagamento &&
        pagamento.value === "Dinheiro"
    ) {

        areaTroco.style.display = "block";

    }

}


// ==========================================
// RESUMO
// ==========================================

function mostrarResumo() {

    const lista =
    document.getElementById(
        "listaPedido"
    );

    let total = 0;

    if (carrinho.length === 0) {

        lista.innerHTML =
        "Seu carrinho está vazio.";

        document.getElementById(
            "totalPedido"
        ).textContent =
        "Total: R$ 0,00";

        return;

    }


    let html = "";


    carrinho.forEach(function(item) {

        const quantidade =
        Number(item.quantidade || 1);

        const preco =
        Number(item.preco || 0);

        const subtotal =
        preco * quantidade;

        total += subtotal;


        html += `
            <div style="
                margin-bottom:14px;
                padding-bottom:10px;
                border-bottom:1px solid #ddd;
            ">

                <strong>
                    ${quantidade}x ${item.nome}
                </strong>

                <br>

                <span>
                    R$ ${preco.toFixed(2).replace(".",",")}
                    cada
                </span>

                <br>

                <strong style="color:#c62828;">
                    Subtotal:
                    R$ ${subtotal.toFixed(2).replace(".",",")}
                </strong>
        `;


        if (
            item.detalhes &&
            item.detalhes.length > 0
        ) {

            html += `
                <br>
                <small>
                    ${item.detalhes.join("<br>")}
                </small>
            `;

        }


        html += `
            </div>
        `;

    });


    lista.innerHTML = html;


    document.getElementById(
        "totalPedido"
    ).textContent =
    "Total: R$ " +
    total.toFixed(2).replace(".",",");

}


// ==========================================
// ENVIAR PEDIDO
// ==========================================

function enviarPedido() {

    if (carrinho.length === 0) {

        alert(
            "Seu carrinho está vazio."
        );

        return;

    }


    const nome =
    document.getElementById(
        "nome"
    ).value.trim();


    const telefone =
    document.getElementById(
        "telefone"
    ).value.trim();


    const tipo =
    document.querySelector(
        'input[name="tipo"]:checked'
    ).value;


    const pagamento =
    document.querySelector(
        'input[name="pagamento"]:checked'
    );


    // ======================================
    // VALIDAÇÕES
    // ======================================

    if (!nome) {

        alert(
            "Digite seu nome."
        );

        return;

    }


    if (!telefone) {

        alert(
            "Digite seu telefone."
        );

        return;

    }


    if (!pagamento) {

        alert(
            "Escolha a forma de pagamento."
        );

        return;

    }


    let mensagem =
    "*NOVO PEDIDO - PASTELARIA EL SHADDAI*"
    + "\n\n";


    mensagem +=
    "*Cliente:* " +
    nome +
    "\n";


    mensagem +=
    "*Telefone:* " +
    telefone +
    "\n";


    mensagem +=
    "*Forma de recebimento:* " +
    tipo +
    "\n";


    // ======================================
    // ENDEREÇO
    // ======================================

    if (tipo === "Entrega") {

        const rua =
        document.getElementById(
            "rua"
        ).value.trim();


        const numero =
        document.getElementById(
            "numero"
        ).value.trim();


        const complemento =
        document.getElementById(
            "complemento"
        ).value.trim();


        const referencia =
        document.getElementById(
            "referencia"
        ).value.trim();


        const bairro =
        document.getElementById(
            "bairro"
        ).value.trim();


        if (
            !rua ||
            !numero ||
            !bairro
        ) {

            alert(
                "Preencha rua, número e bairro."
            );

            return;

        }


        mensagem +=
        "\n*ENDEREÇO DE ENTREGA*\n";


        mensagem +=
        "Rua: " +
        rua +
        "\n";


        mensagem +=
        "Número: " +
        numero +
        "\n";


        mensagem +=
        "Bairro: " +
        bairro +
        "\n";


        if (complemento) {

            mensagem +=
            "Complemento: " +
            complemento +
            "\n";

        }


        if (referencia) {

            mensagem +=
            "Referência: " +
            referencia +
            "\n";

        }

    }


    // ======================================
    // PAGAMENTO
    // ======================================

    mensagem +=
    "\n*PAGAMENTO:* " +
    pagamento.value +
    "\n";


    // PIX

    if (
        pagamento.value === "Pix"
    ) {

        const pixQuando =
        document.querySelector(
            'input[name="pixQuando"]:checked'
        );


        if (!pixQuando) {

            alert(
                "Escolha se o Pix será pago agora ou na entrega."
            );

            return;

        }


        mensagem +=
        "Pix: " +
        (
            pixQuando.value === "Agora"
            ? "Pagar agora"
            : "Pagar na entrega"
        ) +
        "\n";

    }


    // CARTÃO

    if (
        pagamento.value === "Cartão"
    ) {

        const cartaoTipo =
        document.querySelector(
            'input[name="cartaoTipo"]:checked'
        );


        if (!cartaoTipo) {

            alert(
                "Escolha se o cartão será Crédito ou Débito."
            );

            return;

        }


        mensagem +=
        "Cartão: " +
        cartaoTipo.value +
        " — Pagar na entrega\n";

    }


    // DINHEIRO

    if (
        pagamento.value === "Dinheiro"
    ) {

        const troco =
        document.getElementById(
            "troco"
        ).value.trim();


        if (!troco) {

            alert(
                "Informe para quanto precisa de troco."
            );

            return;

        }


        mensagem +=
        "Dinheiro — Pagar na entrega\n";


        mensagem +=
        "Troco para: " +
        troco +
        "\n";

    }


    // ======================================
    // OBSERVAÇÃO
    // ======================================

    const observacao =
    document.getElementById(
        "observacao"
    ).value.trim();


    if (observacao) {

        mensagem +=
        "\n*OBSERVAÇÕES:*\n" +
        observacao +
        "\n";

    }


    // ======================================
    // PEDIDOS
    // ======================================

    mensagem +=
    "\n*PEDIDO:*\n";


    let total = 0;


    carrinho.forEach(function(item) {

        const quantidade =
        Number(item.quantidade || 1);


        const preco =
        Number(item.preco || 0);


        const subtotal =
        preco * quantidade;


        total += subtotal;


        mensagem +=
        "• " +
        quantidade +
        "x " +
        item.nome;


        if (
            item.detalhes &&
            item.detalhes.length > 0
        ) {

            mensagem +=
            "\n  Detalhes: " +
            item.detalhes.join(", ");

        }


        mensagem +=
        "\n  R$ " +
        subtotal
        .toFixed(2)
        .replace(".",",") +
        "\n";

    });


    mensagem +=
    "\n*TOTAL: R$ " +
    total
    .toFixed(2)
    .replace(".",",") +
    "*";


    // ======================================
    // WHATSAPP
    // ======================================

    const url =
    "https://api.whatsapp.com/send?phone=5585988944421&text=" +
    encodeURIComponent(mensagem);


    window.open(
        url,
        "_blank"
    );


    localStorage.removeItem(
        "carrinho"
    );


    window.location.href =
    "index.html";

}


// ==========================================
// INICIAR
// ==========================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        mostrarEndereco();

        mostrarOpcoesPagamento();

        mostrarResumo();

    }
);

</script>

</body>

    </html>
