<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acompanhar pedido — Pastelaria El Shaddai</title><style>body{margin:0;background:#fff8e7;font-family:Arial,sans-serif;color:#222}.wrap{width:min(650px,92%);margin:22px auto}.head{background:linear-gradient(135deg,#c62828,#e53935,#ffb300);color:#fff;padding:22px;border-radius:20px;text-align:center}.card{background:#fff;border:1px solid #eadfce;border-radius:18px;padding:18px;margin-top:14px}.status{font-size:22px;font-weight:900;color:#c62828}.item{padding:9px;border-bottom:1px solid #eee}.muted{color:#707070}.aguarde{background:linear-gradient(135deg,#c62828,#e53935 55%,#ffb300);color:#fff;border:3px solid #ffb300;border-radius:22px;padding:20px;text-align:center;margin-top:14px;box-shadow:0 8px 20px #0002}.aguarde strong{display:block;color:#fff;font-size:22px}.clock{font-size:38px;font-weight:900;color:#c62828;background:#fff;border-radius:14px;padding:8px;margin:10px}.negado{background:#fff0f0;border:3px solid #c62828;border-radius:22px;padding:20px;text-align:center;color:#8b0012;font-weight:700}.pill{display:inline-block;background:#fff0cf;border-radius:999px;padding:7px 12px;font-weight:700;color:#a84d00}</style></head><body><div class="wrap"><div class="head"><h1 style="margin:0">Acompanhar pedido</h1><p style="margin:6px 0 0">Pastelaria El Shaddai</p></div><div id="app" class="card">Carregando...</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js?v=20261007-final"></script><script>
const id=new URLSearchParams(location.search).get("id"),box=document.getElementById("app");const moeda=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));const mapa={novo:"Aguardando aprovação",em_preparo:"Pedido aceito — em preparo",pronto:"Pedido pronto",saiu_entrega:"Saiu para entrega",concluido:"Pedido concluído",cancelado:"Pedido não aceito"};let timer;
function metaObs(raw){try{return JSON.parse(raw||"{}")}catch{return {}}}
async function carregar(){if(!id){box.innerHTML="<p>Pedido não informado.</p>";return}const r=await supabaseClient.from("pedidos").select("*").eq("id",id).limit(1);if(r.error||!r.data?.length){box.innerHTML="<p>Pedido não encontrado.</p>";return}const p=r.data[0],meta=metaObs(p.observacao),itens=Array.isArray(p.itens)?p.itens:[];clearInterval(timer);let html=`<h2 style="margin-top:0">Pedido #${esc(p.id)}</h2><div class="status">${esc(mapa[p.status]||p.status||"Pedido recebido")}</div>`;if(p.status==="novo"){const fim=new Date(meta.aceite_expira_em||Date.now()+60000).getTime();html+=`<div class="aguarde"><strong>Seu pedido foi recebido</strong><div>Aguarde o ADM aceitar o pedido. O prazo configurado pela loja é de até ${Math.ceil(Math.max(15,(new Date(meta.aceite_expira_em||Date.now()+60000).getTime()-Date.now())/1000))} segundos.</div><div class="clock" id="clock">--:--</div><span class="pill">A aprovação é necessária antes de seguir para o WhatsApp</span></div>`;box.innerHTML=html;const tick=()=>{const ms=Math.max(0,fim-Date.now()),s=Math.ceil(ms/1000);const el=document.getElementById("clock");if(el)el.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");if(!ms)clearInterval(timer)};tick();timer=setInterval(tick,250);return}if(p.status==="cancelado"){html+=`<div class="negado"><div>Pedido não aceito</div><p style="font-weight:400;margin-bottom:0">${esc(meta.motivoNegacao||"A loja não aceitou o pedido.")}</p></div>`}html+=`<p class="muted">Atualizado em ${new Date(p.criado_em).toLocaleString("pt-BR")}</p><div class="card"><h3>Itens</h3>${itens.map(i=>`<div class="item"><strong>${Number(i.quantidade||1)}x ${esc(i.nome||i.produto||"")}</strong> — ${moeda(i.preco||0)}${Array.isArray(i.detalhes)&&i.detalhes.length?`<br><small>${esc(i.detalhes.join(" · "))}</small>`:""}</div>`).join("")}<p><strong>Total: ${moeda(p.total)}</strong></p></div>`;box.innerHTML=html}carregar();setInterval(carregar,2500);</script></body></html>
