<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b71c1c"><title>Acompanhar Pedido — Pastelaria El Shaddai</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><img id="logo" src="Logo.png" alt="Logo"><div class="brand-text"><strong id="name">Pastelaria El Shaddai</strong><span id="slogan">Feito a dois, no ponto pra você!</span></div></a><a class="cart-btn" href="index.html">Cardápio</a></div></header><main class="menu-wrap" style="max-width:800px"><section class="panel"><h1 style="color:#b71c1c;margin-top:0">Acompanhar pedido <span id="orderId"></span></h1><p id="message">Carregando...</p><div id="timeline"></div><div id="summary"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>const db=window.supabaseClient,id=new URLSearchParams(location.search).get('id'),money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const steps=['novo','aceito','em preparo'];async function load(){if(!id||!db){document.getElementById('message').textContent='Pedido não encontrado.';return}const [o,c]=await Promise.all([db.from('pedidos').select('*').eq('id',id).maybeSingle(),db.from('configuracoes_loja').select('*').limit(1).maybeSingle()]);if(o.error||!o.data){document.getElementById('message').textContent='Pedido não encontrado.';return}const p=o.data;document.getElementById('orderId').textContent='#'+p.id;document.getElementById('name').textContent=c.data?.nome_loja||'Pastelaria El Shaddai';document.getElementById('slogan').textContent=c.data?.slogan||'Feito a dois, no ponto pra você!';document.getElementById('logo').src=c.data?.logo||'Logo.png';if(p.status==='cancelado'){document.getElementById('message').textContent='Este pedido foi rejeitado/cancelado.';document.getElementById('timeline').innerHTML='<div class="notice closed">Pedido cancelado.</div>';return}const last=p.tipo==='retirada'?'pronto para retirada':'saiu para entrega';const all=[...steps,last,'entregue'];const current=all.indexOf(p.status);document.getElementById('message').textContent=p.status==='entregue'?'Pedido entregue. Obrigado!':`Status atual: ${p.status}`;document.getElementById('timeline').innerHTML=all.map((s,i)=>`<div style="display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #eadfce"><span style="width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:${i<=current?'#b71c1c':'#eee'};color:#fff;font-weight:800">${i<=current?'✓':''}</span><strong style="color:${i<=current?'#b71c1c':'#756a61'}">${esc(s.replace(/\b\w/g,m=>m.toUpperCase()))}</strong></div>`).join('');document.getElementById('summary').innerHTML=`<div class="cart-summary"><div class="summary-row"><span>Cliente</span><strong>${esc(p.cliente_nome)}</strong></div><div class="summary-row"><span>Tipo</span><strong>${esc(p.tipo)}</strong></div><div class="summary-row total"><span>Total</span><strong>${money(p.total)}</strong></div></div>`}load();setInterval(load,15000);</script></body></html>
