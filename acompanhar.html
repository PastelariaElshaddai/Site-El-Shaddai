<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acompanhar pedido - Pastelaria El Shaddai</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff8e1;color:#222;font-family:Arial,Helvetica,sans-serif}header{background:linear-gradient(135deg,#e53935,#ffb300);color:#fff;text-align:center;padding:24px 16px}header h1{margin:0 0 6px;font-size:27px}header p{margin:0}.container{width:94%;max-width:650px;margin:22px auto;background:#fff;border:2px solid #ffb300;border-radius:18px;padding:18px;box-shadow:0 5px 20px rgba(0,0,0,.1)}h2,h3{color:#d84315}.grupo{margin-bottom:14px}.grupo label{display:block;font-weight:bold;margin-bottom:6px}input{width:100%;padding:13px;border:1px solid #ccc;border-radius:9px;font-size:16px}.btn{width:100%;padding:14px;border:0;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer}.primary{background:#ffb300}.light{background:#fff;border:1px solid #ddd;margin-top:10px}.card{margin-top:18px;padding:15px;background:#fff8e1;border:1px solid #ffcc80;border-radius:12px}.pedido-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.badge{padding:8px 12px;border-radius:999px;background:#fff3cd;font-weight:bold;color:#8d1b2d}.timeline{display:grid;gap:9px;margin-top:16px}.step{padding:12px;border:1px solid #ddd;border-radius:10px;background:#fff;color:#666}.step.atual{border:2px solid #ffb300;background:#fff8d8;color:#8d1b2d;font-weight:bold}.step.ok{background:#e8f5e9;border-color:#a5d6a7;color:#2e7d32}.item{padding:9px 0;border-bottom:1px solid #ddd}.total{font-size:21px;font-weight:bold;color:#d84315;margin-top:12px}.notice{padding:12px;border-radius:10px;background:#fff3cd;border:1px solid #ffe08a;margin-top:12px}.erro{padding:12px;border-radius:10px;background:#ffe5e5;border:1px solid #ef9a9a;color:#a11;margin-top:12px}@media(max-width:520px){.container{width:96%;padding:15px}.pedido-head{display:block}.badge{display:inline-block;margin-top:8px}}
</style></head><body><header><h1 id="lojaNome">Pastelaria El Shaddai</h1><p id="lojaSlogan">Feito a dois, no ponto pra você!</p></header><div class="container"><h2>Acompanhar pedido</h2><p>Informe o número do pedido e o telefone usado na compra.</p><div class="grupo"><label for="pedidoId">Número do pedido</label><input id="pedidoId" inputmode="numeric" placeholder="Ex.: 3"></div><div class="grupo"><label for="telefone">Telefone</label><input id="telefone" inputmode="tel" placeholder="Ex.: 85988942211"></div><button class="btn primary" onclick="consultarPedido()">Consultar pedido</button><div id="resultado"></div><button class="btn light" onclick="window.location.href='index.html'">Voltar para o cardápio</button></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const moeda=v=>'R$ '+Number(v||0).toFixed(2).replace('.',',');
const statusMap={novo:'Recebido',em_preparo:'Em preparo',pronto:'Pronto',saiu_entrega:'Saiu para entrega',concluido:'Concluído',cancelado:'Cancelado'};
const ordem=['novo','em_preparo','pronto','saiu_entrega','concluido'];let timer=null;
function statusTexto(s){return statusMap[s]||s||'Recebido'}
function renderPedido(p){const atual=p.status||'novo',idx=ordem.indexOf(atual);let timeline='';if(atual==='cancelado'){timeline='<div class="step atual">Pedido cancelado</div>'}else{timeline=ordem.map((st,i)=>'<div class="step '+(i<idx?'ok ':'')+(st===atual?'atual':'')+'"><strong>'+statusTexto(st)+'</strong>'+(st===atual?'<br><small>Este é o status atual do seu pedido.</small>':'')+'</div>').join('')}const itens=Array.isArray(p.itens?.itens)?p.itens.itens:Array.isArray(p.itens)?p.itens:[];document.getElementById('resultado').innerHTML='<div class="card"><div class="pedido-head"><div><strong>Pedido #'+esc(p.id)+'</strong><br><small>'+new Date(p.criado_em).toLocaleString('pt-BR')+'</small></div><span class="badge">'+esc(statusTexto(atual))+'</span></div><div class="timeline">'+timeline+'</div><h3>Resumo</h3>'+itens.map(i=>'<div class="item"><strong>'+Number(i.quantidade||1)+'x '+esc(i.nome||i.produto||'Produto')+'</strong> — '+moeda(Number(i.preco||0)*Number(i.quantidade||1))+(i.detalhes?.length?'<br><small>'+i.detalhes.map(esc).join(' | ')+'</small>':'')+'</div>').join('')+'<div class="total">Total: '+moeda(p.total)+'</div></div>'}
async function consultarPedido(){const id=document.getElementById('pedidoId').value.trim(),tel=document.getElementById('telefone').value.replace(/\D/g,'');const out=document.getElementById('resultado');if(!id||!tel){out.innerHTML='<div class="erro">Informe o número do pedido e o telefone.</div>';return}try{const r=await supabaseClient.from('pedidos').select('*').eq('id',Number(id)).eq('cliente_telefone',tel).limit(1);if(r.error)throw r.error;if(!r.data?.length){out.innerHTML='<div class="erro">Pedido não encontrado. Confira o número e o telefone usados na compra.</div>';return}renderPedido(r.data[0]);localStorage.setItem('elshaddai_ultimo_pedido',String(id));localStorage.setItem('elshaddai_telefone_cliente',tel);iniciarAtualizacao(Number(id),tel)}catch(e){console.error(e);out.innerHTML='<div class="erro">Não foi possível consultar o pedido agora.</div>'}}
function iniciarAtualizacao(id,tel){if(timer)clearInterval(timer);timer=setInterval(async()=>{try{const r=await supabaseClient.from('pedidos').select('*').eq('id',id).eq('cliente_telefone',tel).limit(1);if(!r.error&&r.data?.length)renderPedido(r.data[0])}catch(e){}},5000)}
async function carregarLoja(){try{const r=await supabaseClient.from('configuracoes_loja').select('nome_loja,slogan').limit(1);if(!r.error&&r.data?.length){document.getElementById('lojaNome').textContent=r.data[0].nome_loja||'Pastelaria El Shaddai';document.getElementById('lojaSlogan').textContent=r.data[0].slogan||'Feito a dois, no ponto pra você!'}}catch(e){}}
document.addEventListener('DOMContentLoaded',async()=>{await carregarLoja();const q=new URLSearchParams(location.search),id=q.get('pedido')||localStorage.getItem('elshaddai_ultimo_pedido'),tel=q.get('telefone')||localStorage.getItem('elshaddai_telefone_cliente');if(id)document.getElementById('pedidoId').value=id;if(tel)document.getElementById('telefone').value=tel;if(id&&tel)consultarPedido()});
</script></body></html>
