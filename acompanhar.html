<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acompanhar pedido — Pastelaria El Shaddai</title><style>body{margin:0;background:#fff8e7;font-family:Arial,sans-serif;color:#222}.wrap{width:min(650px,92%);margin:25px auto}.head{background:linear-gradient(135deg,#c62828,#e53935,#ffb300);color:#fff;padding:22px;border-radius:18px;text-align:center}.card{background:#fff;border:1px solid #eadfce;border-radius:16px;padding:18px;margin-top:14px}.status{font-size:22px;font-weight:800;color:#c62828}.item{padding:9px;border-bottom:1px solid #eee}.muted{color:#707070}</style></head><body><div class="wrap"><div class="head"><h1 style="margin:0">Acompanhar pedido</h1><p style="margin:6px 0 0">Pastelaria El Shaddai</p></div><div class="card"><div id="app">Carregando...</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js?v=20261005-final2"></script><script>
const id=new URLSearchParams(location.search).get("id"),box=document.getElementById("app"),statusMap={novo:"Pedido recebido",em_preparo:"Em preparo",pronto:"Pronto",saiu_entrega:"Saiu para entrega",concluido:"Concluído",cancelado:"Cancelado"};const moeda=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
async function carregar(){if(!id){box.innerHTML="<p>Pedido não informado.</p>";return}const r=await supabaseClient.from("pedidos").select("*").eq("id",id).limit(1);if(r.error||!r.data?.length){box.innerHTML="<p>Pedido não encontrado.</p>";return}const p=r.data[0],itens=Array.isArray(p.itens)?p.itens:[];box.innerHTML=`<h2>Pedido #${esc(p.id)}</h2><div class="status">${esc(statusMap[p.status]||p.status||"Pedido recebido")}</div><p class="muted">Atualizado em ${new Date(p.criado_em).toLocaleString("pt-BR")}</p><div class="card"><h3>Itens</h3>${itens.map(i=>`<div class="item"><strong>${Number(i.quantidade||1)}x ${esc(i.nome||i.produto||"")}</strong> — ${moeda(i.preco||0)}</div>`).join("")}<p><strong>Total: ${moeda(p.total)}</strong></p></div>`}carregar();setInterval(carregar,15000);
</script></body></html>
