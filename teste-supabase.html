<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste Supabase • El Shaddai</title>
<style>
body{font-family:Arial,sans-serif;background:#fff8e7;padding:20px;color:#222}h1{color:#c62828}.box{background:#fff;border-radius:14px;padding:16px;margin:12px 0;border:1px solid #ddd}.ok{color:#197a37}.err{color:#b00020}.wait{color:#996600}pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:12px;border-radius:10px}
</style>
</head>
<body>
<h1>🥟 Teste de conexão</h1>
<div id="status" class="box wait">Iniciando teste...</div>
<div id="resultado" class="box"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=teste20260909"></script>
<script>
(async function(){
 const status=document.getElementById('status');
 const resultado=document.getElementById('resultado');
 try{
   status.textContent='1/4 • Biblioteca Supabase carregada.';
   if(!window.supabase) throw new Error('A biblioteca do Supabase não carregou (window.supabase está ausente).');
   status.textContent='2/4 • supabase.js carregado.';
   if(!window.supabaseClient) throw new Error('supabaseClient não foi criado pelo supabase.js.');
   status.textContent='3/4 • Consultando categorias e produtos...';
   const [c,p]=await Promise.all([
     window.supabaseClient.from('categorias').select('id,nome,ativo').order('id'),
     window.supabaseClient.from('produtos').select('id,nome,preco,categoria').order('id')
   ]);
   if(c.error) throw new Error('Categorias: '+c.error.message);
   if(p.error) throw new Error('Produtos: '+p.error.message);
   status.className='box ok';
   status.textContent='4/4 • CONEXÃO FUNCIONANDO ✅';
   resultado.innerHTML='<h3>Resultado</h3><p><b>Categorias:</b> '+c.data.length+'</p><p><b>Produtos:</b> '+p.data.length+'</p><pre>'+JSON.stringify({categorias:c.data,produtos:p.data},null,2)+'</pre>';
 }catch(e){
   console.error(e);
   status.className='box err';
   status.textContent='ERRO ❌';
   resultado.innerHTML='<h3>Detalhes do erro</h3><pre>'+String(e.message||e)+'</pre>';
 }
})();
</script>
</body>
</html>
